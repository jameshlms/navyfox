[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navyfox"
version = "0.1.3"
description = "Deep DOCX manipulation via a C# Native AOT shared library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/jameshlms/navyfox"
Repository = "https://github.com/jameshlms/navyfox"

[project.optional-dependencies]
pandas = [
    "pandas>=2",
]
docs = [
    "sphinx>=8",
    "furo>=2024",
    "sphinx-autoapi>=3.3",
    "myst-parser>=4",
]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "python-docx>=1.1",
    "hatchling",
    "build",
    "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/navyfox"]
exclude = [
    "src/navyfox/_libs/**/*.dbg",
    "src/navyfox/_libs/**/.gitkeep",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["tests/"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["navyfox"]

[tool.pyright]
pythonVersion = "3.12"
reportPrivateUsage = "none"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.0",
]
