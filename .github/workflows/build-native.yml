name: Build Native Binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            lib_name: NavyFox.Native.so
            container: quay.io/pypa/manylinux_2_28_x86_64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            lib_name: NavyFox.Native.so
            container: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: yum install -y clang zlib-devel libxml2-devel

      - name: Install .NET 9
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 9.0 --install-dir /usr/local/dotnet
          echo "/usr/local/dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=/usr/local/dotnet" >> $GITHUB_ENV

      - name: Publish Native AOT shared library
        run: >
          dotnet publish native/NavyFox.Native/NavyFox.Native.csproj
          -r ${{ matrix.rid }}
          -c Release
          --self-contained true
          -p:PublishAot=true
          -p:NativeLib=Shared
          -p:StripSymbols=true
          -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/${{ matrix.lib_name }}
          if-no-files-found: error
          retention-days: 7

  build-other:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2022
            lib_name: NavyFox.Native.dll
            publish_props: ""
          - rid: win-arm64
            os: windows-11-arm
            lib_name: NavyFox.Native.dll
            publish_props: ""
          - rid: osx-arm64
            os: macos-15
            lib_name: NavyFox.Native.dylib
            publish_props: "-p:MacOSXDeploymentTarget=12.0"
          - rid: osx-x64
            os: macos-15
            lib_name: NavyFox.Native.dylib
            publish_props: "-p:MacOSXDeploymentTarget=12.0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish Native AOT shared library
        run: >
          dotnet publish native/NavyFox.Native/NavyFox.Native.csproj
          -r ${{ matrix.rid }}
          -c Release
          --self-contained true
          -p:PublishAot=true
          -p:NativeLib=Shared
          -p:StripSymbols=true
          ${{ matrix.publish_props }}
          -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/${{ matrix.lib_name }}
          if-no-files-found: error
          retention-days: 7
