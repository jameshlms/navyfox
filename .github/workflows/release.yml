name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # create GitHub releases and upload assets
  actions: read    # download artifacts from reusable workflow jobs

jobs:
  build-native:
    uses: ./.github/workflows/build-native.yml

  build-wheel:
    name: Build wheel (${{ matrix.rid }})
    runs-on: ubuntu-24.04
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            lib_name: NavyFox.Native.so
            auditwheel_plat: manylinux_2_28_x86_64
          - rid: linux-arm64
            lib_name: NavyFox.Native.so
            auditwheel_plat: manylinux_2_28_aarch64
          - rid: win-x64
            lib_name: NavyFox.Native.dll
            wheel_plat: win_amd64
          - rid: win-arm64
            lib_name: NavyFox.Native.dll
            wheel_plat: win_arm64
          - rid: osx-arm64
            lib_name: NavyFox.Native.dylib
            wheel_plat: macosx_12_0_arm64
          - rid: osx-x64
            lib_name: NavyFox.Native.dylib
            wheel_plat: macosx_12_0_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/navyfox/_libs/${{ matrix.rid }}/

      - name: Remove .gitkeep placeholders
        run: find src/navyfox/_libs -name '.gitkeep' -delete

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build wheel twine auditwheel

      - name: Install patchelf (Linux wheels)
        if: ${{ matrix.auditwheel_plat }}
        run: sudo apt-get install -y --no-install-recommends patchelf

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Repair and retag wheel with auditwheel (Linux)
        if: ${{ matrix.auditwheel_plat }}
        run: |
          auditwheel repair dist/*.whl --plat ${{ matrix.auditwheel_plat }} -w dist/repaired/
          rm dist/*.whl
          mv dist/repaired/*.whl dist/

      - name: Retag wheel (non-Linux)
        if: ${{ matrix.wheel_plat }}
        run: wheel tags --platform-tag ${{ matrix.wheel_plat }} --remove dist/*.whl

      - name: Stage native binary as release asset
        shell: bash
        run: |
          mkdir -p native_asset
          cp src/navyfox/_libs/${{ matrix.rid }}/${{ matrix.lib_name }} \
             native_asset/${{ matrix.rid }}-${{ matrix.lib_name }}

      - name: Upload native binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: native_asset/${{ matrix.rid }}-${{ matrix.lib_name }}
          fail_on_unmatched_files: true

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.whl
          fail_on_unmatched_files: true

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist
        run: python -m build --sdist --no-isolation

      - name: Upload sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
