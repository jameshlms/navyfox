name: Release

on:
  workflow_run:
    workflows: ["Build Native Binaries"]
    types: [completed]

permissions:
  contents: write  # create GitHub releases and upload assets
  actions: read    # download artifacts from the build workflow run

jobs:
  build-wheel:
    name: Build wheel (${{ matrix.rid }})
    runs-on: ubuntu-24.04
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            auditwheel_plat: manylinux_2_28_x86_64
          - rid: linux-arm64
            auditwheel_plat: manylinux_2_28_aarch64
          - rid: win-x64
            wheel_plat: win_amd64
          - rid: win-arm64
            wheel_plat: win_arm64
          - rid: osx-arm64
            wheel_plat: macosx_12_0_arm64
          - rid: osx-x64
            wheel_plat: macosx_12_0_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/navyfox/_libs/${{ matrix.rid }}/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove .gitkeep placeholders
        run: find src/navyfox/_libs -name '.gitkeep' -delete

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build wheel twine auditwheel

      - name: Install patchelf (Linux wheels)
        if: matrix.auditwheel_plat
        run: sudo apt-get install -y --no-install-recommends patchelf

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Repair and retag wheel with auditwheel (Linux)
        if: matrix.auditwheel_plat
        run: |
          auditwheel repair dist/*.whl --plat ${{ matrix.auditwheel_plat }} -w dist/repaired/
          rm dist/*.whl
          mv dist/repaired/*.whl dist/

      - name: Retag wheel (non-Linux)
        if: matrix.wheel_plat
        run: wheel tags --platform-tag ${{ matrix.wheel_plat }} --remove dist/*.whl

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: dist/*.whl
          fail_on_unmatched_files: true

      - name: Publish wheel to PyPI
        if: ${{ secrets.PYPI_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist
        run: python -m build --sdist --no-isolation

      - name: Upload sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

      - name: Publish sdist to PyPI
        if: ${{ secrets.PYPI_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*.tar.gz
