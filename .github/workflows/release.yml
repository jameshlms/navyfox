name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # create GitHub releases and upload assets
  actions: read    # download artifacts from reusable workflow jobs

jobs:
  build-native:
    uses: ./.github/workflows/build-native.yml

  build-wheel:
    name: Build wheel (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            lib_name: NavyFox.Native.so
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            lib_name: NavyFox.Native.so
          - rid: win-x64
            os: windows-2022
            lib_name: NavyFox.Native.dll
          - rid: win-arm64
            os: windows-11-arm
            lib_name: NavyFox.Native.dll
          - rid: osx-arm64
            os: macos-15
            lib_name: NavyFox.Native.dylib
          - rid: osx-x64
            os: macos-15
            lib_name: NavyFox.Native.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/navyfox/_libs/${{ matrix.rid }}/

      - name: Remove .gitkeep placeholders
        shell: bash
        run: find src/navyfox/_libs -name '.gitkeep' -delete

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        shell: bash
        env:
          NAVYFOX_RID: ${{ matrix.rid }}
        run: |
          pip install build hatchling
          python -m build --wheel --no-isolation

      - name: Bundle DLL dependencies with delvewheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install delvewheel
          delvewheel repair dist/*.whl -w dist/repaired/
          rm dist/*.whl
          mv dist/repaired/*.whl dist/

      - name: Smoke-test wheel
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: |
          pip install --no-index --find-links=dist navyfox
          python -c "import navyfox; navyfox.Document(); print('smoke: OK')"

      - name: Smoke-test wheel (Docker, Linux only)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist":/wheels:ro \
            python:3.12-slim \
            sh -c "pip install -q --no-index --find-links=/wheels navyfox && python -c 'import navyfox; navyfox.Document()' && echo 'docker: OK'"

      - name: Stage native binary as release asset
        shell: bash
        run: |
          mkdir -p native_asset
          cp src/navyfox/_libs/${{ matrix.rid }}/${{ matrix.lib_name }} \
             native_asset/${{ matrix.rid }}-${{ matrix.lib_name }}

      - name: Upload native binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: native_asset/${{ matrix.rid }}-${{ matrix.lib_name }}
          fail_on_unmatched_files: true

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.whl
          fail_on_unmatched_files: true

      - name: Upload wheel artifact for PyPI
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.rid }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build hatchling
          python -m build --sdist --no-isolation

      - name: Upload sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

      - name: Upload sdist artifact for PyPI
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/navyfox
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
