name: Release

on:
  workflow_run:
    workflows: ["Build Native Binaries"]
    types: [completed]

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build wheel (${{ matrix.rid }})
    runs-on: ubuntu-24.04
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            wheel_plat: linux_x86_64
          - rid: linux-arm64
            wheel_plat: linux_aarch64
          - rid: win-x64
            wheel_plat: win_amd64
          - rid: win-arm64
            wheel_plat: win_arm64
          - rid: osx-arm64
            wheel_plat: macosx_12_0_arm64
          - rid: osx-x64
            wheel_plat: macosx_12_0_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/navyfox/_libs/${{ matrix.rid }}/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove .gitkeep placeholders
        run: find src/navyfox/_libs -name '.gitkeep' -delete

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build wheel twine

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Retag wheel for ${{ matrix.wheel_plat }}
        run: wheel tags --platform-tag ${{ matrix.wheel_plat }} --remove dist/*.whl

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist
        run: python -m build --sdist --no-isolation

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*.tar.gz
